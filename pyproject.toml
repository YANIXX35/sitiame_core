[project]
name = "sitiame_core"
authors = [
    { name = "Sitiame Capital", email = "contact@sitiame-capital.com" },
]
description = "Inscription entreprise publique sur ERPNext, avec creation automatique de Company + User."
requires-python = ">=3.10"
readme = "README.md"
