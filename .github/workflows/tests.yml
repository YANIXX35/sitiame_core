name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # same as the production bench
      - run: pip install pytest requests openpyxl python-docx werkzeug pillow
      - run: python -m pytest tests -q
