{% extends "templates/web.html" %}

{% block title %}Inscription entreprise | Sitiame Capital{% endblock %}

{% block page_content %}
<style>
	.signup-wrap { max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
	.signup-wrap h1 { font-size: 1.6rem; margin-bottom: .25rem; color: #05157c; }
	.signup-wrap .subtitle { color: #666; margin-bottom: 1.5rem; }
	.signup-section { font-weight: 600; margin: 1.5rem 0 .75rem; color: #05157c; border-bottom: 2px solid #d4af37; padding-bottom: .25rem; }
	.signup-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
	.signup-field { flex: 1 1 260px; }
	.signup-field label { display: block; font-size: .85rem; margin-bottom: .25rem; color: #333; }
	.signup-field input, .signup-field select {
		width: 100%; padding: .55rem .7rem; border: 1px solid #ccc; border-radius: 6px; font-size: .95rem;
	}
	/* iOS zooms the page when an input under 16px gets focus */
	@media (max-width: 575.98px) {
		.signup-field input, .signup-field select { font-size: 16px; }
	}
	#signup-submit {
		background: #05157c; color: #fff; border: none; padding: .7rem 1.5rem; border-radius: 6px;
		font-size: 1rem; cursor: pointer; margin-top: .5rem;
	}
	#signup-submit:disabled { opacity: .6; cursor: not-allowed; }
	#signup-error { color: #b30000; margin-top: .75rem; display: none; }
	#signup-success { color: #0a6e0a; margin-top: .75rem; display: none; }
	.signup-honeypot { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; width: 0; overflow: hidden; }
	.signup-consent { display: flex; align-items: flex-start; gap: .5rem; margin-top: 1rem; font-size: .85rem; color: #333; }
	.signup-consent input { margin-top: .2rem; }
	#captcha-question { font-weight: 600; }
	/* Progress indicator during background provisioning */
	.signup-progress { margin-top: .5rem; }
	.signup-progress-bar-wrap { background: #e0e4f7; border-radius: 8px; height: 8px; overflow: hidden; margin: .5rem 0; }
	.signup-progress-bar { background: #05157c; height: 100%; border-radius: 8px; width: 5%;
		transition: width 3s ease; }
	.signup-progress-step { font-size: .82rem; color: #444; margin-top: .25rem; min-height: 1.2em; }
	@keyframes spin { to { transform: rotate(360deg); } }
	.signup-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #c3caeb;
		border-top-color: #05157c; border-radius: 50%; animation: spin .8s linear infinite;
		vertical-align: middle; margin-right: .4rem; }
</style>

<div class="signup-wrap">
	<h1>Inscrire votre entreprise</h1>
	<p class="subtitle">Créez votre compte Sitiame Capital sur ERPNext.</p>

	<form id="signup-form">
		<div class="signup-section">Votre compte</div>
		<div class="signup-row">
			<div class="signup-field">
				<label for="contact_name">Nom du responsable *</label>
				<input type="text" id="contact_name" name="contact_name" required>
			</div>
			<div class="signup-field">
				<label for="email">Email professionnel *</label>
				<input type="email" id="email" name="email" required>
			</div>
		</div>
		<div class="signup-row">
			<div class="signup-field">
				<label for="phone">Téléphone</label>
				<input type="tel" id="phone" name="phone">
			</div>
			<div class="signup-field">
				<label for="password">Mot de passe * (8 caractères minimum)</label>
				<input type="password" id="password" name="password" minlength="8" required>
			</div>
		</div>

		<div class="signup-section">Votre entreprise</div>
		<div class="signup-row">
			<div class="signup-field">
				<label for="company_name">Nom de l'entreprise *</label>
				<input type="text" id="company_name" name="company_name" required>
			</div>
			<div class="signup-field">
				<label for="company_sigle">Sigle usuel</label>
				<input type="text" id="company_sigle" name="company_sigle">
			</div>
		</div>
		<div class="signup-row">
			<div class="signup-field">
				<label for="company_tax_id">N° d'identification fiscale (NIF)</label>
				<input type="text" id="company_tax_id" name="company_tax_id">
			</div>
			<div class="signup-field">
				<label for="sector">Secteur d'activité</label>
				<select id="sector" name="sector">
					<option value="">Secteur d'activité</option>
					<option value="Technologies & IT">Technologies &amp; IT</option>
					<option value="Commerce & Retail">Commerce &amp; Retail</option>
					<option value="Services">Services</option>
					<option value="Industrie">Industrie</option>
					<option value="Sante">Santé</option>
					<option value="Education">Éducation</option>
					<option value="Autres">Autres</option>
				</select>
			</div>
		</div>
		<div class="signup-row">
			<div class="signup-field">
				<label for="rccm">Numéro RCCM / SIRET</label>
				<input type="text" id="rccm" name="rccm">
			</div>
			<div class="signup-field">
				<label for="city">Ville</label>
				<input type="text" id="city" name="city">
			</div>
		</div>
		<div class="signup-row">
			<div class="signup-field">
				<label for="address">Adresse complète</label>
				<input type="text" id="address" name="address">
			</div>
		</div>

		<div class="signup-field" style="max-width: 260px;">
			<label for="captcha_answer"><span id="captcha-question">Chargement...</span></label>
			<input type="number" id="captcha_answer" name="captcha_answer" required>
		</div>

		<!-- Honeypot: hidden from real visitors via CSS, left blank by them.
		     Bots that auto-fill every field trip it and get a generic rejection. -->
		<div class="signup-honeypot" aria-hidden="true">
			<label for="website">Ne pas remplir</label>
			<input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
		</div>

		<label class="signup-consent">
			<input type="checkbox" id="terms_accepted" name="terms_accepted" required>
			<span>J'accepte que Sitiame Capital traite les informations transmises ci-dessus pour la création et la gestion de mon compte entreprise.</span>
		</label>

		<button type="submit" id="signup-submit">Créer mon compte</button>
		<div id="signup-error"></div>
		<div id="signup-success">
			<span id="signup-success-msg"></span>
			<div class="signup-progress" id="signup-progress" style="display:none;">
				<div class="signup-progress-bar-wrap">
					<div class="signup-progress-bar" id="signup-progress-bar"></div>
				</div>
				<div class="signup-progress-step" id="signup-progress-step"></div>
			</div>
		</div>
	</form>
</div>

<script>
function stripHtml(html) {
	var tmp = document.createElement("div");
	tmp.innerHTML = html;
	return (tmp.textContent || tmp.innerText || "").trim();
}

function extractErrorMessage(data) {
	if (data._server_messages) {
		try {
			var messages = JSON.parse(data._server_messages);
			var parts = messages.map(function (m) {
				try {
					return stripHtml(JSON.parse(m).message || "");
				} catch (e) {
					return stripHtml(m);
				}
			}).filter(Boolean);
			if (parts.length) return parts.join(" ");
		} catch (e) {
			// fall through
		}
	}
	if (data.exception) {
		var lastPart = data.exception.split(":").pop();
		return stripHtml(lastPart);
	}
	return "Une erreur est survenue, veuillez réessayer.";
}

var currentCaptchaToken = null;

function loadCaptcha() {
	fetch("/api/method/sitiame_core.api.get_signup_captcha")
		.then(function (res) { return res.json(); })
		.then(function (result) {
			var data = result.message || {};
			currentCaptchaToken = data.token || null;
			document.getElementById("captcha-question").textContent = data.question || "Verification anti-robot";
			document.getElementById("captcha_answer").value = "";
		})
		.catch(function () {
			document.getElementById("captcha-question").textContent = "Verification indisponible, rechargez la page.";
		});
}
loadCaptcha();

document.getElementById("signup-form").addEventListener("submit", function (e) {
	e.preventDefault();

	var errorBox = document.getElementById("signup-error");
	var successBox = document.getElementById("signup-success");
	var submitBtn = document.getElementById("signup-submit");
	errorBox.style.display = "none";
	successBox.style.display = "none";
	submitBtn.disabled = true;
	submitBtn.textContent = "Création en cours...";

	var payload = {
		contact_name: document.getElementById("contact_name").value,
		email: document.getElementById("email").value,
		phone: document.getElementById("phone").value,
		password: document.getElementById("password").value,
		company_name: document.getElementById("company_name").value,
		company_sigle: document.getElementById("company_sigle").value,
		company_tax_id: document.getElementById("company_tax_id").value,
		sector: document.getElementById("sector").value,
		rccm: document.getElementById("rccm").value,
		address: document.getElementById("address").value,
		city: document.getElementById("city").value,
		captcha_token: currentCaptchaToken,
		captcha_answer: document.getElementById("captcha_answer").value,
		terms_accepted: document.getElementById("terms_accepted").checked ? 1 : 0,
		website: document.getElementById("website").value,
	};

	var headers = { "Content-Type": "application/json" };
	if (window.frappe && frappe.csrf_token && frappe.csrf_token !== "None") {
		headers["X-Frappe-CSRF-Token"] = frappe.csrf_token;
	}

	fetch("/api/method/sitiame_core.api.register_company", {
		method: "POST",
		headers: headers,
		body: JSON.stringify(payload),
	})
		.then(function (res) {
			return res.json().then(function (data) {
				return { ok: res.ok, data: data };
			});
		})
		.then(function (result) {
			if (result.ok && result.data.message && result.data.message.pending && result.data.message.token) {
				document.getElementById("signup-success-msg").innerHTML =
					'<span class="signup-spinner"></span>Création en cours (1 à 3 minutes)...';
				document.getElementById("signup-progress").style.display = "block";
				document.getElementById("signup-progress-step").textContent = "Initialisation du compte...";
				successBox.style.display = "block";
				pollSignupStatus(result.data.message.token);
			} else {
				var msg = extractErrorMessage(result.data);
				errorBox.textContent = msg;
				errorBox.style.display = "block";
				submitBtn.disabled = false;
				submitBtn.textContent = "Créer mon compte";
				loadCaptcha();
			}
		})
		.catch(function () {
			errorBox.textContent = "Impossible de contacter le serveur, veuillez réessayer.";
			errorBox.style.display = "block";
			submitBtn.disabled = false;
			submitBtn.textContent = "Créer mon compte";
			loadCaptcha();
		});

	function pollSignupStatus(token) {
		var errorBox   = document.getElementById("signup-error");
		var successBox = document.getElementById("signup-success");
		var submitBtn  = document.getElementById("signup-submit");
		var progressBar  = document.getElementById("signup-progress-bar");
		var progressStep = document.getElementById("signup-progress-step");

		var attempts = 0;
		var maxAttempts = 120; // ~4 min — SYSCOHADA (1 370 comptes) peut prendre 60-90 s
		var consecutiveNotFound = 0;
		var maxConsecutiveNotFound = 10; // 20 s de tolérance avant de considérer le token perdu

		// Messages qui évoluent selon le temps écoulé (toutes les 2 s × tentatives)
		var steps = [
			{ after:  0, pct:  5, msg: "Création de l'utilisateur..." },
			{ after:  5, pct: 15, msg: "Création de la société..." },
			{ after: 10, pct: 30, msg: "Import du plan comptable SYSCOHADA (1 370 comptes)..." },
			{ after: 25, pct: 50, msg: "Import du plan comptable en cours..." },
			{ after: 40, pct: 65, msg: "Encore quelques instants..." },
			{ after: 60, pct: 78, msg: "Finalisation des paramètres..." },
			{ after: 80, pct: 88, msg: "Presque terminé..." },
		];

		function updateProgress(attempts) {
			var elapsed = attempts; // 1 unité = 2 s
			var current = steps[0];
			for (var i = 0; i < steps.length; i++) {
				if (elapsed >= steps[i].after) current = steps[i];
			}
			progressBar.style.width = current.pct + "%";
			progressStep.textContent = current.msg;
		}

		function resetForm() {
			successBox.style.display = "none";
			submitBtn.disabled = false;
			submitBtn.textContent = "Créer mon compte";
		}

		var interval = setInterval(function () {
			attempts += 1;
			updateProgress(attempts);

			fetch("/api/method/sitiame_core.api.get_company_signup_status?token=" + encodeURIComponent(token))
				.then(function (res) { return res.json(); })
				.then(function (result) {
					var status = (result.message || {}).status;

					if (status === "success") {
						clearInterval(interval);
						progressBar.style.width = "100%";
						progressStep.textContent = "Compte créé !";
						document.getElementById("signup-success-msg").textContent = "Compte créé, connexion en cours...";
						window.location.href = result.message.redirect || "/app";
						return;
					}

					if (status === "failed") {
						clearInterval(interval);
						resetForm();
						errorBox.textContent = (result.message && result.message.message) ||
							"La création de votre compte a échoué. Veuillez réessayer ou nous contacter.";
						errorBox.style.display = "block";
						loadCaptcha();
						return;
					}

					if (status === "not_found") {
						consecutiveNotFound += 1;
						// Après 20 s sans token Redis : le job n'a peut-être pas encore démarré.
						// On affiche un message rassurant (essayez de vous connecter) au lieu
						// d'un "échec" qui affolera un utilisateur dont le compte a bien été créé.
						if (consecutiveNotFound >= maxConsecutiveNotFound) {
							clearInterval(interval);
							resetForm();
							errorBox.textContent = "Votre compte est probablement créé : essayez de vous connecter avec votre email et mot de passe. Si cela ne fonctionne pas, contactez-nous.";
							errorBox.style.display = "block";
						}
						return;
					}

					consecutiveNotFound = 0;

					if (attempts >= maxAttempts) {
						clearInterval(interval);
						resetForm();
						errorBox.textContent = "La création prend plus de temps que prévu. Votre compte est probablement créé : essayez de vous connecter avec votre email et mot de passe. Si cela ne fonctionne pas, contactez-nous.";
						errorBox.style.display = "block";
					}
				})
				.catch(function () {
					if (attempts >= maxAttempts) {
						clearInterval(interval);
						resetForm();
						errorBox.textContent = "Impossible de contacter le serveur, veuillez réessayer.";
						errorBox.style.display = "block";
					}
				});
		}, 2000);
	}
});
</script>
{% endblock %}
